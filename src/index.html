<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Harinath G — Senior Software Engineer (.NET · Angular · Flutter)</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Harinath G — Senior Software Engineer and Team Lead building .NET, Angular and Flutter applications for web and Android/iOS.">
  <meta name="theme-color" content="#0b0f14">
  <meta property="og:title" content="Harinath G — Senior Software Engineer">
  <meta property="og:description" content=".NET · Angular · Flutter — web and Android/iOS applications.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // Apply the saved theme before Angular boots, so there's no flash.
    try {
      var t = localStorage.getItem('hg-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>

  <!-- Static copy of the contact form so Netlify Forms detects it at deploy time. -->
  <form name="contact" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="name">
    <input type="email" name="email">
    <textarea name="message"></textarea>
    <input name="bot-field">
  </form>
</body>
</html>
